name: Deploy Frontend

# Build + deploy the SPA to devnet on every push to main (and on manual
# dispatch). There is no PR-preview deploy; PR validation is unit tests (see
# e2e.yml).
#
# Deploy CLI: @polkadot-community-foundation/polkadot-app-deploy@0.16.7 — it ships
# the built-in `devnet` env (DotNS v0.8.0 addresses). deploy.sh passes
# --mnemonic (direct signer), --config, --js-merkle and
# --no-transfer-to-signedin-user. The app is not listed in browse
# (BULLETIN_DEPLOY_PUBLISH=false).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-w3spay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm bug #4828: lockfiles generated on macOS can omit Linux optional
        # native packages. Resolve fresh on the runner so Rollup/PAPI native
        # packages are present for this platform.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Install deploy tool
        run: npm install -g @polkadot-community-foundation/polkadot-app-deploy@0.16.7

      - name: Deploy customer app to devnet
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: ./deploy.sh "w3spaycheckout.dot"
        env:
          # The Bulletin-authorized uploader (5Fk8) that owns w3spaycheckout.dot
          # — signs both the Bulletin upload and the DotNS bind. The domain is
          # baked into the build as the product identity (the deeplink). On
          # devnet the checkout lives at w3spaycheckout.dot; the Summit name
          # w3spay.dot is not registered there.
          MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
          BULLETIN_ENV: devnet
          VITE_NETWORK: devnet
          # Not listed in the browse app-directory on devnet.
          BULLETIN_DEPLOY_PUBLISH: 'false'
          # Devnet W3SPayRegistry (from w3spay-admin, live on Paseo AH 1000).
          # Override via the repo var after a registry redeploy; otherwise this
          # known-good default is baked (src/config.ts carries the same devnet default).
          VITE_W3SPAY_REGISTRY_ADDRESS: ${{ vars.VITE_W3SPAY_REGISTRY_ADDRESS_SUMMIT || '0x950c0243cb112abe1112924f1fcab04fb03ae670' }}
          VITE_W3SPAY_PILOT_MERCHANT_ID: ${{ vars.VITE_W3SPAY_PILOT_MERCHANT_ID || 'funkhaus' }}
          NODE_OPTIONS: '--max-old-space-size=8192'
